services:

  api:
    build: .
    container_name: api
    env_file:
      - .env
    ports:
      - "3000:5000"
    restart: unless-stopped
    depends_on:
      - redis

  worker:
    build: .
    container_name: worker
    env_file:
      - .env
    command: npm run worker:prod
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
