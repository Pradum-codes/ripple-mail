    <path d="M -190 -40 Q -260 -50 -330 -35" fill="none" stroke="#2DD4BF" stroke-width="16"
          stroke-linecap="round" opacity="0.9"/>
    <path d="M -190 5 Q -270 10 -355 22" fill="none" stroke="#2DD4BF" stroke-width="16"
          stroke-linecap="round" opacity="0.55"/>
    <path d="M -190 50 Q -280 65 -380 88" fill="none" stroke="#2DD4BF" stroke-width="16"
          stroke-linecap="round" opacity="0.3"/>

    <!-- Paper plane -->
    <path d="M 300 0 L -170 -105 L -30 0 Z" fill="url(#wingTop)"/>
    <path d="M 300 0 L -30 0 L -170 105 Z" fill="url(#wingBottom)"/>
  </g>
</svg>
